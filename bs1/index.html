<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Building Systems 1 | ETH Zurich</title>
    <meta name="description" content="ETH Zurich Building Systems 1 — interactive 3D CFD airflow model and top-down velocity plot.">
    <link rel="canonical" href="https://git.feddern.dev/bs1/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Building Systems 1 | ETH Zurich">
    <meta property="og:description" content="Interactive 3D CFD airflow model and top-down velocity plot.">
    <meta property="og:url" content="https://git.feddern.dev/bs1/">
    <meta property="og:image" content="https://git.feddern.dev/bs1/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://git.feddern.dev/bs1/og.jpg">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>

<body>
    <div class="container">
        <!-- Model Viewer -->
        <div class="viewer-container">
            <model-viewer
                id="model-viewer"
                src="model1.gltf"
                ar
                ar-modes="webxr scene-viewer quick-look"
                camera-controls
                auto-rotate
                shadow-intensity="2"
                alt="Building Systems 1 3D Model"
                exposure="1"
                shadow-softness="0.3"
                camera-orbit="180deg 55deg auto"
                min-camera-orbit="auto auto 1m"
                max-camera-orbit="auto auto 100m"
                field-of-view="45deg"
                max-field-of-view="60deg"
                min-field-of-view="20deg"
                interaction-prompt="none"
                orientation="0deg -90deg 0deg"
                loading="eager">
            </model-viewer>

            <!-- Top-down velocity plot -->
            <div class="info-panel">
                <div class="info-panel-header">
                    <h3>Top-down View</h3>
                    <button class="minimize-btn" title="Minimize panel">−</button>
                </div>

                <a class="info-panel-content" href="top-down.webp" target="_blank" rel="noopener">
                    <img src="top-down.webp" width="2470" height="1152" alt="Top-down CFD plot of air velocity magnitude across the room">
                </a>
            </div>

            <!-- Footer -->
            <footer class="footer">
                <p><a href="../" class="hub-link">← All projects</a> &nbsp;·&nbsp; &copy; 2026 Timo Feddern</p>
            </footer>
        </div>
    </div>

    <script>
        // The exporter writes alpha 0.25 on the outer shell but omits alphaMode,
        // so glTF defaults to OPAQUE and ignores it. Enable blending at load.
        const modelViewer = document.querySelector('model-viewer');
        modelViewer.addEventListener('load', () => {
            const shell = modelViewer.model.materials[0];
            shell.setAlphaMode('BLEND');
        });

        // Minimize/maximize the top-down panel
        const infoPanel = document.querySelector('.info-panel');
        const minimizeBtn = document.querySelector('.minimize-btn');

        minimizeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            infoPanel.classList.toggle('minimized');
            minimizeBtn.textContent = infoPanel.classList.contains('minimized') ? '+' : '−';
        });

        // Click on minimized panel to expand
        infoPanel.addEventListener('click', () => {
            if (infoPanel.classList.contains('minimized')) {
                infoPanel.classList.remove('minimized');
                minimizeBtn.textContent = '−';
            }
        });
    </script>
</body>

</html>
