<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6B5D4F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A3F35;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#leafGradient)" stroke="#F5EDDC" stroke-width="2"/>
  
  <!-- Leaf shape -->
  <path d="M 50 20 Q 70 30, 75 50 Q 70 70, 50 80 Q 30 70, 25 50 Q 30 30, 50 20 Z" 
        fill="#F5EDDC" 
        opacity="0.95"/>
  
  <!-- Leaf vein (center line) -->
  <line x1="50" y1="25" x2="50" y2="75" 
        stroke="#8B7355" 
        stroke-width="2" 
        stroke-linecap="round"/>
  
  <!-- Leaf veins (left side) -->
  <path d="M 50 35 Q 40 40, 35 45" 
        stroke="#8B7355" 
        stroke-width="1.5" 
        fill="none" 
        stroke-linecap="round"/>
  <path d="M 50 45 Q 40 50, 33 55" 
        stroke="#8B7355" 
        stroke-width="1.5" 
        fill="none" 
        stroke-linecap="round"/>
  <path d="M 50 55 Q 40 60, 35 65" 
        stroke="#8B7355" 
        stroke-width="1.5" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Leaf veins (right side) -->
  <path d="M 50 35 Q 60 40, 65 45" 
        stroke="#8B7355" 
        stroke-width="1.5" 
        fill="none" 
        stroke-linecap="round"/>
  <path d="M 50 45 Q 60 50, 67 55" 
        stroke="#8B7355" 
        stroke-width="1.5" 
        fill="none" 
        stroke-linecap="round"/>
  <path d="M 50 55 Q 60 60, 65 65" 
        stroke="#8B7355" 
        stroke-width="1.5" 
        fill="none" 
        stroke-linecap="round"/>
</svg>

